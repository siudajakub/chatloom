name: Personal client synthetic checks
on:
  workflow_dispatch:
  push:
    branches: [main, personal/client]
  pull_request:
    paths: ['lib/personal/**', 'packages/**', 'worker/**', 'push-gateway/**', 'test/personal/**']
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - run: dart pub get
        working-directory: packages/personal_core
      - run: python3 scripts/verify-personal.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r push-gateway/requirements.txt
      - run: python3 -m unittest discover -s push-gateway/tests -v

  android_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --debug --target-platform android-arm64
