name: Personal macOS

on:
  # Run manually before a release; routine pushes use lightweight shared checks.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-macos-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode 26 SDK required by pinned plugins
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Toolchain
        run: |
          xcodebuild -version
          flutter --version
          df -h .
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze application
        run: flutter analyze lib --no-fatal-infos
      - name: Desktop and recorder regressions
        run: >-
          flutter test --no-pub
          test/personal/macos_desktop_test.dart
          test/personal/round_video/macos_round_backend_test.dart
          test/personal/round_video/round_capture_controller_test.dart
          test/personal/round_video/round_capture_profile_test.dart
          test/notion/two_column_accessibility_test.dart
          test/notion/settings_widgets_test.dart
          test/notion/compact_audio_player_test.dart
          test/personal/transcript_panel_test.dart
          test/utils/session_backup_writer_test.dart
          test/personal/recording_lifecycle_test.dart
          test/personal/integration/notification_eligibility_test.dart
      - name: Account-free native storage and crypto smoke test
        timeout-minutes: 20
        run: python3 scripts/macos/build.py --smoke-test
      # An ad-hoc signature changes with every build, so the login Keychain
      # treats each update as a new program and asks once per stored item.
      # The owner's self-signed certificate keeps the designated requirement
      # stable; it lives in a temporary keychain removed after the build.
      - name: Import stable signing certificate
        id: signing
        env:
          P12: ${{ secrets.CHATLOOM_MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.CHATLOOM_MACOS_SIGNING_P12_PASSWORD }}
          IDENTITY: ${{ vars.CHATLOOM_MACOS_SIGN_IDENTITY || 'ChatLoom Local Signing' }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning::CHATLOOM_MACOS_SIGNING_P12 is not set: the app is ad-hoc signed and macOS asks for Keychain access after every update"
            exit 0
          fi
          keychain="$RUNNER_TEMP/chatloom-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          echo "CHATLOOM_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build and verify release bundle
        run: python3 scripts/macos/build.py
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"
      - name: Upload app and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ChatLoom-macos-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 7
