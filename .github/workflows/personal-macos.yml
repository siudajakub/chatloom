name: Personal macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personal-macos.yml'
      - 'macos/**'
      - 'lib/**'
      - 'packages/**'
      - 'integration_test/macos/**'
      - 'test/**'
      - 'scripts/build-personal-macos.py'
      - 'scripts/macos/**'
      - 'scripts/macos_native_toolchain.py'
      - 'scripts/macos-webcrypto.cmake'
      - 'scripts/flutter-queue.py'
      - 'pubspec.*'

permissions:
  contents: read

concurrency:
  group: personal-macos-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode 26 SDK required by pinned plugins
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Toolchain
        run: |
          xcodebuild -version
          flutter --version
          df -h .
      - name: Resolve pinned dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze application
        run: flutter analyze lib --no-fatal-infos
      - name: Prepare the scoped Intel native toolchain fix
        run: python3 scripts/macos/native_toolchain.py
      - name: Desktop and recorder regressions
        run: >-
          flutter test --no-pub
          test/personal/macos_desktop_test.dart
          test/personal/round_video/macos_round_backend_test.dart
          test/personal/round_video/round_capture_controller_test.dart
          test/personal/round_video/round_capture_profile_test.dart
          test/notion/two_column_accessibility_test.dart
          test/notion/settings_widgets_test.dart
          test/notion/compact_audio_player_test.dart
          test/personal/transcript_panel_test.dart
          test/utils/session_backup_writer_test.dart
          test/personal/recording_lifecycle_test.dart
          test/personal/integration/notification_eligibility_test.dart
      - name: Account-free native storage and crypto smoke test
        timeout-minutes: 20
        run: python3 scripts/macos/build.py --smoke-test
      - name: Build and verify release bundle
        run: python3 scripts/macos/build.py
      - name: Upload app and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: ChatLoom-macos-${{ runner.arch }}-${{ github.sha }}
          path: artifacts/macos/*
          if-no-files-found: error
          retention-days: 7
