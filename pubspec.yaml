name: chatloom
description: Chat with your friends.
publish_to: none
# On version bump please also increase the build number.
version: 2.10.0+3568

environment:
  sdk: ">=3.11.1 <4.0.0"

dependencies:
  personal_core:
    path: packages/personal_core
  archive: ^4.3.0
  async: ^2.13.1
  blurhash_dart: ^1.2.1
  collection: ^1.18.0
  connectivity_plus: 7.3.1
  crypto: ^3.0.7
  crop_image: ^1.0.17
  cross_file: ^0.3.5
  cupertino_ui: ^1.1.1
  desktop_drop: ^0.8.4
  device_info_plus: ^13.2.0
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_animate: 4.5.2
  flutter_foreground_task: ^11.0.3
  flutter_linkify: ^6.0.0
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_new_badger: ^2.0.0
  flutter_secure_storage: ^11.2.0
  flutter_shortcuts_new: ^2.0.0
  flutter_vodozemac: ^0.8.1
  flutter_web_auth_2: ^5.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  highlight: ^0.7.0
  html: ^0.15.7
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: 0.20.3
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  light_compressor_v2: ^1.9.1
  local_auth: ^3.0.2
  lottie: ^3.6.1
  material_ui: 1.4.0
  matrix:
    path: packages/matrix
  mime: ^2.1.0
  ogg_caf_converter: ^0.1.4
  package_info_plus: ^10.2.0
  pasteboard: ^0.5.0
  path: ^1.9.0
  path_provider: ^2.1.6
  path_provider_foundation: ^2.6.0
  pretty_qr_code: ^3.6.0
  provider: ^6.0.2
  punycode: ^1.0.0
  qr_code_scanner_plus: ^2.3.0
  qr_image: ^1.0.0
  receive_sharing_intent: ^1.8.1
  record: ^7.1.1
  scroll_to_index: ^3.0.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  skeletonizer: 3.0.0
  slugify: ^2.0.0
  sqflite_common_ffi: ^2.4.3
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0
  universal_html: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0
  wakelock_plus: ^1.8.0
  fcm_shared_isolate: 3.0.0
  flutter_svg: 2.3.0

dev_dependencies:
  webcrypto: 0.6.1
  fake_async: 1.3.3
  dart_code_linter: ^4.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  license_checker: ^1.6.2
  path_provider_platform_interface: 2.1.3

  test: any
  video_player_platform_interface: any
  wakelock_plus_platform_interface: any
flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/notion/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/notion/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/notion/fonts/Roboto-Bold.ttf
          weight: 700
  assets:
    - assets/
    - assets/logo/mini/
    - assets/notion/pinned/
    - assets/notion/fonts/
    - assets/sounds/
    - assets/vodozemac/0.8.1/

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

# Guidelines for adding a dependency override:
# 1. Don't do it if you can avoid it or fix it upstream in a manageable time
# 2. Always link an (upstream?) issue
# 3. Explain how and when this can be removed (overrides must be temporarily)
dependency_overrides:
