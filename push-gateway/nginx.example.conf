# Template only. Select DNS/TLS with J before deployment; do not expose 8088.
# Place these zones in nginx's http {} block.
limit_req_zone $binary_remote_addr zone=personal_push_rate:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=personal_push_connections:1m;

server {
    listen 443 ssl;
    server_name push.example.invalid;
    ssl_certificate /etc/letsencrypt/live/push.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 8s;
    client_header_timeout 8s;
    access_log off;
    # Optional, only with J's approval: metadata-only access log (no client IP,
    # no query string, no body). The gateway already logs one content-free line
    # per request to journald; this adds nginx-side status/latency if needed.
    # log_format personal_push_meta '$time_iso8601 $request_method $uri $status $request_length $request_time $upstream_status';  # http {} block
    # access_log /var/log/nginx/personal-push-meta.log personal_push_meta;
    error_log /var/log/nginx/personal-push-error.log crit;

    location = /_matrix/push/v1/notify {
        limit_req zone=personal_push_rate burst=20 nodelay;
        limit_req_status 503;
        limit_conn personal_push_connections 8;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 90s;
        proxy_send_timeout 8s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    # Enable with the authenticated-registration gateway release. No bearer
    # session credentials; the JSON body carries only a short-lived OpenID proof.
    location = /_personal/push/v1/register {
        limit_req zone=personal_push_rate burst=5 nodelay;
        limit_req_status 429;
        limit_conn personal_push_connections 4;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host localhost;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 8s;
        proxy_request_buffering on;
        proxy_buffering off;
    }
    location / { return 404; }
}
