<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../kit/kit.css">
<style>
  /* Conversation shrinks while the panel replaces the keyboard. */
  .timeline { transition: bottom .42s var(--ease); bottom: 76px; }
  body.panel .timeline { bottom: 456px; }
  .chathead .more { font: 700 18px Roboto; letter-spacing: 1px; color: var(--text); }
  .chathead .bar { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }

  #dockwrap { position: absolute; left: 0; right: 0; bottom: 0; height: 456px; transform: translateY(380px); transition: transform .42s var(--ease); }
  body.panel #dockwrap { transform: none; }
  #dockwrap .composer { position: relative; height: 76px; padding-bottom: 8px; }
  .composer .plus svg, .composer .mic svg, .composer .emo svg { display: block; }
  .composer .field { padding-right: 6px; }
  .composer .field .ph { flex: 1; color: var(--text3); }
  .composer .emo { width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; color: var(--text2); transition: background .2s; }
  body.panel .composer .emo { background: var(--selected); color: var(--text); }
  .composer .mic { width: 44px; height: 44px; display: grid; place-items: center; }
  .ico-kb { display: none !important; } body.panel .ico-kb { display: block !important; } body.panel .ico-smile { display: none !important; }

  #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: #202020; border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; overflow: hidden; }
  .tabs { position: relative; display: flex; height: 46px; border-bottom: 1px solid var(--border); }
  .tabs .tab { flex: 1; display: grid; place-items: center; font: 500 14.5px Roboto; color: var(--text2); transition: color .25s; }
  .tabs .tab.on { color: var(--text); }
  .tabs .ind { position: absolute; bottom: -1px; height: 2.5px; width: 56px; border-radius: 2px; background: var(--accent); left: 37px; transition: left .32s var(--ease); }
  .pane { position: absolute; top: 47px; left: 0; right: 0; bottom: 0; padding: 10px 12px 0; transition: opacity .22s; }
  .pane.off { opacity: 0; }

  .emogrid { display: grid; grid-template-columns: repeat(8, 1fr); row-gap: 6px; font: 26px/40px "Noto Color Emoji"; text-align: center; }
  .sublabel { font: 500 12.5px Roboto; color: var(--text3); padding: 2px 4px 8px; letter-spacing: .2px; }

  .search { height: 40px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 14px; color: var(--text3); font: 400 15px Roboto; }
  .search .typed { color: var(--text); }
  .search .bot { margin-left: auto; font: 500 12px Roboto; color: #7FC8F2; background: #173547; padding: 2px 8px; border-radius: 10px; }
  .gifgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .gif { position: relative; height: 92px; border-radius: 12px; overflow: hidden; font-size: 10px; transition: transform .2s, box-shadow .2s; }
  .gif.sel { transform: scale(.94); box-shadow: 0 0 0 2.5px var(--accent); }
  .gif .badge2 { position: absolute; left: 6px; bottom: 5px; font: 700 9px Roboto; color: #fff; background: rgba(0,0,0,.45); padding: 1px 4px; border-radius: 4px; letter-spacing: .4px; }
  .foot { display: flex; align-items: center; gap: 6px; font: 400 12.5px Roboto; color: var(--text3); padding: 12px 4px; }
  .foot .net { position: static; width: 16px; height: 16px; border: none; font-size: 8px; }

  .packs { display: flex; gap: 8px; align-items: center; height: 40px; }
  .packs .pk { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--text2); }
  .packs .pk.on { background: var(--selected); }
  .packs .add { margin-left: auto; font: 500 12.5px Roboto; color: var(--text2); border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px; }
  .stgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .st { height: 84px; display: grid; place-items: center; border-radius: 14px; transition: background .2s, transform .2s; }
  .st svg { width: 72px; height: 72px; }
  .st.sel { background: var(--selected); transform: scale(.92); }

  /* Sent media */
  .gifbub { width: 196px; height: 150px; border-radius: 18px; overflow: hidden; position: relative; font-size: 16px; }
  .gifbub .badge2 { position: absolute; left: 10px; bottom: 9px; font: 700 11px Roboto; color: #fff; background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 5px; }
  .sticker svg { width: 132px; height: 132px; display: block; }

  /* ---------- GIF art (sizes in em so tiles and bubbles share it) ---------- */
  .art { position: absolute; inset: 0; overflow: hidden; }
  .a-conf { background: #2C1D4A; }
  .a-conf i { position: absolute; top: -12%; width: .7em; height: 1.1em; border-radius: .15em; animation: fall 1.5s linear infinite; }
  @keyframes fall { from { transform: translateY(0) rotate(0); } to { transform: translateY(11em) rotate(540deg); } }
  .a-conf b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 2.3em Roboto; color: #fff; text-shadow: 0 .08em 0 #A033FF; }
  @keyframes pulse { from { transform: scale(.92); } to { transform: scale(1.08); } }

  .a-blob { background: #12302F; }
  .a-blob .bl { position: absolute; left: 50%; bottom: 14%; width: 4.6em; height: 4.2em; margin-left: -2.3em; background: #3CD6C2; border-radius: 50% 50% 44% 44% / 58% 58% 42% 42%; transform-origin: 50% 100%; animation: dance .5s ease-in-out infinite alternate; }
  .a-blob .bl::before, .a-blob .bl::after { content: ""; position: absolute; top: 1.3em; width: .55em; height: .7em; border-radius: 50%; background: #10302C; }
  .a-blob .bl::before { left: 1.25em; } .a-blob .bl::after { right: 1.25em; }
  .a-blob .bl s { position: absolute; left: 50%; top: 2.3em; width: 1.2em; height: .6em; margin-left: -.6em; border-radius: 0 0 .6em .6em; background: #10302C; }
  @keyframes dance { from { transform: rotate(-10deg) scale(1.06, .92); } to { transform: rotate(10deg) scale(.94, 1.08) translateY(-.6em); } }
  .a-blob .sh { position: absolute; left: 50%; bottom: 9%; width: 4em; height: .6em; margin-left: -2em; border-radius: 50%; background: rgba(0,0,0,.35); }

  .a-fw { background: #141838; }
  .a-fw .burst { position: absolute; width: 0; height: 0; }
  .a-fw .burst span { position: absolute; left: 0; top: 0; }
  .a-fw .burst span i { position: absolute; left: -.2em; top: -.2em; width: .4em; height: .4em; border-radius: 50%; background: currentColor; animation: boom 1.4s ease-out infinite; }
  @keyframes boom { 0% { transform: translateY(0) scale(1.3); opacity: 1; } 70% { opacity: 1; } 100% { transform: translateY(-2.6em) scale(.4); opacity: 0; } }

  .a-pop { background: #3F2616; }
  .a-pop .em { position: absolute; left: 14%; bottom: 8%; font: 4em/1 "Noto Color Emoji"; transform-origin: 20% 90%; animation: wob .6s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-12deg); } to { transform: rotate(6deg) scale(1.06); } }
  .a-pop i { position: absolute; left: 44%; top: 40%; width: .5em; height: .5em; border-radius: 50%; animation: shoot 1.2s ease-out infinite; }
  @keyframes shoot { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--x), var(--y)); opacity: 0; } }

  .a-face { background: #3A3112; }
  .a-face .em { position: absolute; left: 50%; top: 50%; margin: -1em 0 0 -.6em; font: 3.6em/1 "Noto Color Emoji"; animation: bounce .55s cubic-bezier(.3,0,.4,1) infinite alternate; }
  @keyframes bounce { from { transform: translateY(.25em) scale(1.05, .95); } to { transform: translateY(-.2em); } }
  .a-face u { position: absolute; font: 1.6em/1 "Noto Color Emoji"; text-decoration: none; animation: twinkle .9s ease-in-out infinite alternate; }
  @keyframes twinkle { from { transform: scale(.5) rotate(0); opacity: .4; } to { transform: scale(1.1) rotate(30deg); opacity: 1; } }

  .a-yay { background: #191919; display: grid; place-items: center; }
  .a-yay b { font: 900 3em/1 Roboto; letter-spacing: -.02em; background: linear-gradient(90deg, #FF8C8F, #F2C94C, #5FD39A, #5AB4FF, #B88BEA, #FF8C8F); background-size: 200% 100%; -webkit-background-clip: text; color: transparent; animation: tilt .6s ease-in-out infinite alternate; }
  @keyframes slide { to { background-position: -200% 0; } }
  @keyframes tilt { from { transform: rotate(-6deg) scale(.95); } to { transform: rotate(6deg) scale(1.08); } }

  /* Pixel Pals sticker wiggle once sent */
  .sticker svg { transform-origin: 50% 90%; }
  @keyframes hop { from { transform: rotate(-4deg); } to { transform: rotate(4deg) translateY(-4px); } }
  .sticker .arm { transform-origin: 78px 70px; animation: wave .35s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: rotate(-25deg); } to { transform: rotate(20deg); } }
</style>

<script src="../kit/kit.js"></script>
<script>
  const COLORS = ['#FF8C8F', '#F2C94C', '#5FD39A', '#5AB4FF', '#B88BEA', '#F07CC4', '#FFA36B', '#3CD6C2'];

  // GIF art, sized in em so tiles and the sent bubble share the same drawing.
  function art(kind) {
    if (kind === 'conf') {
      let s = '';
      for (let i = 0; i < 7; i++) {
        s += `<i style="left:${(i * 14 + 5) % 100}%;background:${COLORS[i % 8]};animation-delay:-${(i * 0.37) % 1.5}s;animation-duration:${1.8 + (i % 3) * 0.3}s"></i>`;
      }
      return `<div class="art a-conf">${s}<b>WOO!</b></div>`;
    }
    if (kind === 'blob') return '<div class="art a-blob"><div class="sh"></div><div class="bl"><s></s></div></div>';
    if (kind === 'fw') {
      const burst = (x, y, c, d) => {
        let s = '';
        for (let i = 0; i < 10; i++) s += `<span style="transform:rotate(${i * 36}deg)"><i style="animation-delay:-${d}s"></i></span>`;
        return `<div class="burst" style="left:${x}%;top:${y}%;color:${c}">${s}</div>`;
      };
      return `<div class="art a-fw">${burst(32, 42, '#F2C94C', 0)}${burst(70, 34, '#F07CC4', 0.7)}${burst(58, 72, '#5AB4FF', 0.35)}</div>`;
    }
    if (kind === 'pop') {
      let s = '';
      const dirs = [[3, -3], [4.5, -1], [2, -4.2], [4, -2.6], [5, .2], [1, -4.6]];
      dirs.forEach(([x, y], i) => { s += `<i style="--x:${x}em;--y:${y}em;background:${COLORS[i]};animation-delay:-${i * 0.2}s"></i>`; });
      return `<div class="art a-pop">${s}<span class="em">🎉</span></div>`;
    }
    if (kind === 'face') return '<div class="art a-face"><u style="left:10%;top:12%">✨</u><u style="right:10%;top:20%;animation-delay:-.45s">⭐</u><u style="left:16%;bottom:10%;animation-delay:-.3s">✨</u><span class="em">🥳</span></div>';
    return '<div class="art a-yay"><b>YAY!</b></div>';
  }
  const KINDS = ['conf', 'blob', 'fw', 'pop', 'face', 'yay'];
  $('#gifgrid').innerHTML = KINDS.map((k) => `<div class="gif hidden" data-k="${k}">${art(k)}<span class="badge2">GIF</span></div>`).join('');

  // Pixel Pals: small vector characters drawn here (fictional pack).
  function pal(i, waving = false) {
    const c = ['#F2C94C', '#5FD39A', '#B88BEA', '#FF8C8F', '#5AB4FF', '#FFA36B', '#3CD6C2', '#F07CC4'][i];
    const ears = [
      '<path d="M22 34 26 12 42 28Z M78 34 74 12 58 28Z" fill="C"/>', // cat
      '<circle cx="32" cy="26" r="11" fill="C"/><circle cx="68" cy="26" r="11" fill="C"/><circle cx="32" cy="26" r="5" fill="#fff"/><circle cx="68" cy="26" r="5" fill="#fff"/>', // frog
      '', // ghost
      '<circle cx="26" cy="28" r="9" fill="C"/><circle cx="74" cy="28" r="9" fill="C"/>', // bear
      '<path d="M50 8v14" stroke="C" stroke-width="4"/><circle cx="50" cy="8" r="5" fill="#F2C94C"/>', // robot
      '<path d="M34 24 40 10 46 22 52 8 58 22 64 12 66 26Z" fill="C"/>', // dino
      '<path d="M30 30 22 8 40 24Z M70 30 78 8 60 24Z" fill="C"/>', // bunny-ish
      '<path d="M50 6 55 18 67 20 58 28 61 40 50 34 39 40 42 28 33 20 45 18Z" fill="#F2C94C"/>', // star hat
    ][i].replace(/C/g, c);
    const body = i === 2
      ? `<path d="M22 86V48a28 28 0 0 1 56 0v38l-9-7-10 7-9-7-10 7-9-7Z" fill="${c}"/>`
      : i === 4
        ? `<rect x="22" y="24" width="56" height="58" rx="14" fill="${c}"/>`
        : `<ellipse cx="50" cy="56" rx="30" ry="30" fill="${c}"/>`;
    const face = `<circle cx="40" cy="52" r="4.5" fill="#1E1E1E"/><circle cx="60" cy="52" r="4.5" fill="#1E1E1E"/><circle cx="41.5" cy="50.5" r="1.4" fill="#fff"/><circle cx="61.5" cy="50.5" r="1.4" fill="#fff"/>
      <ellipse cx="33" cy="62" rx="5" ry="3" fill="#fff" opacity=".35"/><ellipse cx="67" cy="62" rx="5" ry="3" fill="#fff" opacity=".35"/>
      <path d="M44 62q6 6 12 0" fill="none" stroke="#1E1E1E" stroke-width="3" stroke-linecap="round"/>`;
    const arm = waving ? `<g class="arm"><ellipse cx="84" cy="56" rx="7" ry="11" fill="${c}"/></g>` : '';
    return `<svg viewBox="0 0 100 100">${ears}${body}${arm}${face}</svg>`;
  }
  $('#stgrid').innerHTML = [0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<div class="st" data-i="${i}">${pal(i)}</div>`).join('');
  $('#pk-pals').innerHTML = pal(0).replace('<svg', '<svg width="28" height="28"');
  $('#pk-2').innerHTML = pal(4).replace('<svg', '<svg width="26" height="26" style="opacity:.6"');

  const tabs = { emoji: ['#t-emoji', '#p-emoji', 37], st: ['#t-st', '#p-st', 167], gif: ['#t-gif', '#p-gif', 297] };
  function showTab(name) {
    for (const [k, [t, p]] of Object.entries(tabs)) {
      $(t).classList.toggle('on', k === name);
      $(p).classList.toggle('off', k !== name);
    }
    $('#ind').style.left = tabs[name][2] + 'px';
  }
  
  function addOut(inner, cls = '') {
    const tl = $('#tl');
    tl.append(html(`<div class="msg out pop">${inner}</div>`));
    const t = html(`<div class="time out pop">18:06 <span class="ticks" style="opacity:0;transition:opacity .25s">✓</span></div>`);
    tl.append(t);
    return t.querySelector('.ticks');
  }
  let tick1, tick2;

  scene(9200, [
    [700, () => tap('#emo')],
    [850, () => document.body.classList.add('panel')],
    [1800, () => tap('#t-gif')],
    [1950, () => showTab('gif')],
    [2250, () => $('#ph2').classList.add('gone')],
    [3050, () => $$('.gif').forEach((g, i) => { g.classList.remove('hidden'); g.style.animationDelay = `${i * 60}ms`; g.classList.add('pop'); })],
    [4500, () => { tap($$('.gif')[0]); $$('.gif')[0].classList.add('sel'); }],
    [4800, () => { tick1 = addOut(`<div class="gifbub">${art('conf')}<span class="badge2">GIF</span></div>`); $$('.gif')[0].classList.remove('sel'); }],
    [5400, () => { tick1.style.opacity = 1; tick1.textContent = '✓✓'; }],
    [5900, () => tap('#t-st')],
    [6050, () => showTab('st')],
    [6900, () => { const s = $$('.st')[0]; tap(s); s.classList.add('sel'); }],
    [7200, () => { tick2 = addOut(`<div class="sticker">${pal(0, true)}</div>`); $$('.st')[0].classList.remove('sel'); }],
    [7700, () => { tick2.style.opacity = 1; tick2.textContent = '✓✓'; }],
    [8200, () => tap('#emo')],
    [8350, () => document.body.classList.remove('panel')],
  ]);
  type('#q', 'celebrate', 2250, 12);
</script>
