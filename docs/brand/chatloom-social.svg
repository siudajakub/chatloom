<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>ChatLoom: all your chats in one calm, private inbox</title>
  <defs>
    <radialGradient id="s-glow-blue" cx="0.30" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#0A7CFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0A7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s-glow-cyan" cx="0.74" cy="0.78" r="0.50">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-card-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#191919"/>
  <rect width="1280" height="640" fill="url(#s-glow-blue)"/>
  <rect width="1280" height="640" fill="url(#s-glow-cyan)"/>
  <!-- A pane of the dock's glass behind the lockup: surface at 58 %, hairline. -->
  <rect x="96" y="120" width="1088" height="400" rx="56" fill="#252525" fill-opacity="0.58"/>
  <rect x="96.5" y="120.5" width="1087" height="399" rx="55.5" fill="none" stroke="url(#s-card-rim)"/>
  <defs>
    <linearGradient id="s-back" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="s-front" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#0A7CFF"/>
    </linearGradient>
    <linearGradient id="s-lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6FBFF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#9CD2FF" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="s-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="s-back-clip"><path d="M876.0,490.6 A280,280 0 1 0 643.0,701.3 Q757.8,685.1 817.2,689.1 Q827.2,690.0 830.7,675.6 Z"/></clipPath>
    <clipPath id="s-front-clip"><path d="M148.0,666.6 A280,280 0 1 1 381.0,877.3 Q266.2,861.1 206.8,865.1 Q196.8,866.0 193.3,851.6 Z"/></clipPath>
  </defs>
  <g transform="translate(275.897 181.130) scale(0.228261)">
    <!-- Back pane: cyan glass with a top sheen and a hairline edge. -->
    <path d="M876.0,490.6 A280,280 0 1 0 643.0,701.3 Q757.8,685.1 817.2,689.1 Q827.2,690.0 830.7,675.6 Z" fill="url(#s-back)"/>
