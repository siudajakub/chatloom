      </g>
    </g>
    <!-- Lens: where the two conversations overlap. -->
    <path d="M148.0,666.6 A280,280 0 1 1 381.0,877.3 Q266.2,861.1 206.8,865.1 Q196.8,866.0 193.3,851.6 Z" fill="url(#s-lens)" clip-path="url(#s-back-clip)"/>
  </g>
