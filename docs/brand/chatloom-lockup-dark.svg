        <path d="M148.0,666.6 A280,280 0 1 1 381.0,877.3 Q266.2,861.1 206.8,865.1 Q196.8,866.0 193.3,851.6 Z" stroke="url(#ld-sheen)" stroke-width="32"/>
        <path d="M148.0,666.6 A280,280 0 1 1 381.0,877.3 Q266.2,861.1 206.8,865.1 Q196.8,866.0 193.3,851.6 Z" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="5"/>
      </g>
    </g>
    <!-- Lens: where the two conversations overlap. -->
    <path d="M148.0,666.6 A280,280 0 1 1 381.0,877.3 Q266.2,861.1 206.8,865.1 Q196.8,866.0 193.3,851.6 Z" fill="url(#ld-lens)" clip-path="url(#ld-back-clip)"/>
  </g>
