<svg xmlns="http://www.w3.org/2000/svg" width="965" height="256" viewBox="-8 -8 965.0 256.0">
  <title>ChatLoom</title>
  <defs>
    <linearGradient id="ld-back" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
