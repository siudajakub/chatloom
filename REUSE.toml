version = 1

[[annotations]]
path = [
    ".mailmap",
    ".tool_versions.yaml",
    "pubspec.lock",
    "*.json",
    ".vscode/**",
    "lib/l10n/**",
    "assets/vodozemac/**",
    ".github/**",
    ".gitignore",
    ".metadata",
    "android/**",
    "macos/**",
    "integration_test/.gitignore",
    "integration_test/data/**",
    "integration_test/synapse/**",
    "web/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-Present Christian Kußowski"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = [
    "assets/sounds/**"
]
SPDX-FileCopyrightText = "Pixabay"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "assets/sas-emoji.json"
]
SPDX-FileCopyrightText = "Matrix Foundation"
SPDX-License-Identifier = "Apache-2.0"

# App Logo (ChatLoom, generated by scripts/render-chatloom-logo.py)
[[annotations]]
path = [
    "assets/logo/**",
    "android/app/src/main/res/mipmap**/**",
    "android/app/src/main/res/drawable**/*.png",
    "macos/Runner/Assets.xcassets/AppIcon.appiconset/**",
    "web/favicon.png",
    "web/icons/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026-Present ChatLoom authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Bundled Roboto font (Apache-2.0, licence text in assets/notion/fonts/Roboto_LICENSE.txt)
[[annotations]]
path = [
    "assets/notion/fonts/Roboto-*.ttf",
    "assets/notion/fonts/Roboto_LICENSE.txt"
]
SPDX-FileCopyrightText = "2011 Google Inc."
SPDX-License-Identifier = "Apache-2.0"

# ChatLoom's own illustrations, documentation, services and test data. Files
# with their own SPDX header keep it (closest precedence).
[[annotations]]
path = [
    "assets/notion/pinned/**",
    "docs/**",
    "worker/**",
    "push-gateway/**",
    "packages/personal_core/**",
    "test/**/goldens/**",
    "NOTICE.md"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026-Present ChatLoom authors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
